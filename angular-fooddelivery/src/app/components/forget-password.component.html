<div class="forget-password-container">
  <div class="forget-password-card">
    <h2>Forgot Password?</h2>
    <p class="description">Enter your username to receive a new password</p>

    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
      <p>Your new password has been sent to your email.</p>
    </div>

    <form [formGroup]="forgetPasswordForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="form-control"
          placeholder="Enter your username"
          required
        />
        <div *ngIf="forgetPasswordForm.get('username')?.invalid && forgetPasswordForm.get('username')?.touched" class="error-text">
          Username is required
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="forgetPasswordForm.invalid || isLoading">
        {{ isLoading ? 'Processing...' : 'Reset Password' }}
      </button>
    </form>

    <button (click)="navigateTo('/login')" class="btn btn-link">
      Back to Login
    </button>
  </div>
</div>

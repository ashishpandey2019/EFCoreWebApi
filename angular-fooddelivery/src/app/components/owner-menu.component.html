<div class="owner-menu">
  <div class="header">
    <h1>Menu Management</h1>
    <button class="btn-add" (click)="openModal()">+ Add Menu Item</button>
  </div>

  <div class="menu-items-container">
    <div *ngIf="menuItems.length === 0" class="empty-state">
      <p>No menu items yet. Add your first item!</p>
    </div>

    <div *ngFor="let item of menuItems" class="menu-item-card" [class.unavailable]="!item.available">
      <div class="item-header">
        <h3>{{ item.name }}</h3>
        <span class="category">{{ item.category }}</span>
      </div>

      <p class="description">{{ item.description }}</p>

      <div class="item-footer">
        <div class="price">${{ item.price.toFixed(2) }}</div>
        <div class="actions">
          <button 
            class="btn-toggle"
            (click)="toggleAvailability(item.id)"
            [class.available]="item.available"
          >
            {{ item.available ? '✓ Available' : '✗ Unavailable' }}
          </button>
          <button class="btn-edit" (click)="editMenuItem(item)">Edit</button>
          <button class="btn-delete" (click)="deleteMenuItem(item.id)">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div *ngIf="showModal" class="modal-overlay" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ editingId ? 'Edit Menu Item' : 'Add New Menu Item' }}</h2>
        <button class="close-btn" (click)="closeModal()">✕</button>
      </div>

      <form (ngSubmit)="editingId ? updateMenuItem() : addMenuItem()" class="menu-form">
        <div class="form-group">
          <label>Item Name</label>
          <input 
            type="text" 
            [(ngModel)]="newItem.name"
            name="name"
            placeholder="e.g., Margherita Pizza"
            required
          >
        </div>

        <div class="form-group">
          <label>Category</label>
          <select [(ngModel)]="newItem.category" name="category" required>
            <option value="">Select Category</option>
            <option value="Pizza">Pizza</option>
            <option value="Pasta">Pasta</option>
            <option value="Salad">Salad</option>
            <option value="Appetizer">Appetizer</option>
            <option value="Dessert">Dessert</option>
            <option value="Beverage">Beverage</option>
          </select>
        </div>

        <div class="form-group">
          <label>Price</label>
          <input 
            type="number" 
            [(ngModel)]="newItem.price"
            name="price"
            placeholder="e.g., 12.99"
            step="0.01"
            required
          >
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea 
            [(ngModel)]="newItem.description"
            name="description"
            placeholder="Describe your item"
            rows="4"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="checkbox">
            <input 
              type="checkbox" 
              [(ngModel)]="newItem.available"
              name="available"
            >
            Available for ordering
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
          <button type="submit" class="btn-submit">{{ editingId ? 'Update' : 'Add' }} Item</button>
        </div>
      </form>
    </div>
  </div>
</div>

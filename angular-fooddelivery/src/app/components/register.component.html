<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>
    
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username:</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="form-control"
          placeholder="Choose a username"
          required
        />
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched" class="error-text">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="Enter a strong password"
          required
        />
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-text">
          Password is required and must be at least 6 characters
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          class="form-control"
          placeholder="Confirm your password"
          required
        />
        <div *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched" class="error-text">
          Please confirm your password
        </div>
        <div *ngIf="registerForm.get('password')?.value !== registerForm.get('confirmPassword')?.value && registerForm.get('confirmPassword')?.touched" class="error-text">
          Passwords do not match
        </div>
      </div>

      <div class="form-group">
        <label for="role">Register as:</label>
        <select id="role" formControlName="role" class="form-control">
          <option value="Customer">Customer</option>
          <option value="RestaurantOwner">Restaurant Owner</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="registerForm.invalid || isLoading">
        {{ isLoading ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <div class="divider">or</div>

    <button (click)="navigateTo('/login')" class="btn btn-secondary btn-block">
      Already have an account? Login here
    </button>
  </div>
</div>

<div class="admin-users">
  <div class="header">
    <h1>Users Management</h1>
  </div>

  <div class="filters">
    <input 
      type="text" 
      placeholder="Search by name or email..." 
      [(ngModel)]="searchTerm"
      (input)="filterUsers()"
      class="search-input"
    >
    <select [(ngModel)]="filterRole" (change)="filterUsers()" class="filter-select">
      <option value="all">All Roles</option>
      <option value="Customer">Customer</option>
      <option value="RestaurantOwner">Restaurant Owner</option>
      <option value="Admin">Admin</option>
    </select>
    <select [(ngModel)]="filterStatus" (change)="filterUsers()" class="filter-select">
      <option value="all">All Status</option>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
      <option value="Suspended">Suspended</option>
    </select>
  </div>

  <div class="table-container">
    <table class="users-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Join Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers" [class]="user.status.toLowerCase()">
          <td class="name">{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phone }}</td>
          <td><span class="role-badge">{{ user.role }}</span></td>
          <td>{{ user.joinDate }}</td>
          <td>
            <span [class]="'status-badge ' + user.status.toLowerCase()">
              {{ user.status }}
            </span>
          </td>
          <td class="actions">
            <select 
              [value]="user.status"
              (change)="updateUserStatus(user.id, $any($event.target).value)"
              class="status-select"
            >
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
              <option value="Suspended">Suspended</option>
            </select>
            <button class="btn-delete" (click)="deleteUser(user.id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="filteredUsers.length === 0" class="empty-state">
    <p>No users found matching your filters</p>
  </div>
</div>
